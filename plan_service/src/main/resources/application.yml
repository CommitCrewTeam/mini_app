server:
  port: 8081
  servlet:
    context-path: /plan_service

spring:
  application:
    name: plan_service
  datasource:
    url: jdbc:postgresql://localhost:5432/plan_service
    username: ecommerce_user
    password: ecommerce_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

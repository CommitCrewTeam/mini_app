databaseChangeLog:
  - changeSet:
      id: 003-create-phone-import
      author: codex
      changes:
        - createSequence:
            sequenceName: phone_import_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: phone_import
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: phone_import_id_seq
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: mode
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: error
                  type: TEXT
              - column:
                  name: upload_file_name
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

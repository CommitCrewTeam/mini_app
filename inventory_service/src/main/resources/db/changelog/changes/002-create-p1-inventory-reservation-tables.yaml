databaseChangeLog:
  - changeSet:
      id: 002-create-p1-inventory-table
      author: codex
      preConditions:
        - not:
            - tableExists:
                tableName: p1_inventory
      changes:
        - createTable:
            tableName: p1_inventory
            columns:
              - column:
                  name: sku
                  type: VARCHAR(50)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: qty_total
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: qty_avail
                  type: INT
                  constraints:
                    nullable: false
                    checkConstraint: "qty_avail >= 0"
              - column:
                  name: qty_reserved
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-p1-reservations-table
      author: codex
      preConditions:
        - not:
            - tableExists:
                tableName: p1_reservations
      changes:
        - createTable:
            tableName: p1_reservations
            columns:
              - column:
                  name: reservation_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sku
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_p1_reservations_inventory
                    references: p1_inventory(sku)
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
                    checkConstraint: "status IN ('PENDING','CONFIRMED','EXPIRED','RELEASED')"
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: p1_reservations
            indexName: idx_p1_reservations_expires_at
            columns:
              - column:
                  name: expires_at
        - createIndex:
            tableName: p1_reservations
            indexName: idx_p1_reservations_user_id_sku
            columns:
              - column:
                  name: user_id
              - column:
                  name: sku

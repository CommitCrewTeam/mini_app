server:
  port: 8082

spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  webflux:
    multipart:
      max-in-memory-size: 256KB
      max-disk-usage-per-part: 20MB
      max-parts: 2
  application:
    name: inventory_service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/inventory_service
    username: ecommerce_user
    password: ecommerce_password
  liquibase:
    url: jdbc:postgresql://localhost:5432/inventory_service
    user: ecommerce_user
    password: ecommerce_password
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  phone-import:
    directory: ${PHONE_IMPORT_DIRECTORY:./data/phone-imports}
    max-bytes: ${PHONE_IMPORT_MAX_BYTES:20971520}
    max-error-rows: ${PHONE_IMPORT_MAX_ERROR_ROWS:1000}
    validation:
      chunk-size: ${PHONE_IMPORT_VALIDATION_CHUNK_SIZE:500}
      workers: ${PHONE_IMPORT_VALIDATION_WORKERS:4}
    approval:
      chunk-size: ${PHONE_IMPORT_APPROVAL_CHUNK_SIZE:500}
      workers: ${PHONE_IMPORT_APPROVAL_WORKERS:5}
      launch-workers: ${PHONE_IMPORT_APPROVAL_LAUNCH_WORKERS:5}
    datasource:
      jdbc-url: ${INVENTORY_BATCH_JDBC_URL:jdbc:postgresql://localhost:5432/inventory_service}
      username: ${INVENTORY_BATCH_DB_USER:ecommerce_user}
      password: ${INVENTORY_BATCH_DB_PASSWORD:ecommerce_password}
      maximum-pool-size: 5

plugins {
    id 'java-library'
}

group = 'com.miniecommerce'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.3.5')
    api 'org.springframework:spring-web'
    api 'org.springframework:spring-context'
    api 'org.springframework.security:spring-security-core'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'io.github.openfeign:feign-core:13.14'

    // Optional infrastructure: consumers opt in with spring-boot-starter-batch.
    compileOnly 'org.springframework.batch:spring-batch-core'
    compileOnly 'org.springframework:spring-jdbc'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.5'
    testImplementation 'org.springframework.batch:spring-batch-core'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

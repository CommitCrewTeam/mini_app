server:
  port: 8081

spring:
  application:
    name: product_service
  datasource:
    url: jdbc:postgresql://localhost:5432/product_service
    username: ecommerce_user
    password: ecommerce_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

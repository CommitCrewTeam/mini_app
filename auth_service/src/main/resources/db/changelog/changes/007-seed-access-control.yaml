databaseChangeLog:
  - changeSet:
      id: 007-rename-super-admin-role
      author: tuan
      changes:
        - update:
            tableName: roles
            columns:
              - column:
                  name: code
                  value: ROLE_ADMIN
              - column:
                  name: name
                  value: Quản trị viên tối cao
              - column:
                  name: description
                  value: Chủ hệ thống, quản lý tất cả mọi thứ kể cả nhân viên.
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP
            where: code = 'SUPER_ADMIN'

  - changeSet:
      id: 007-seed-roles-and-permissions
      author: tuan
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: id
                  value: 00000000-0000-0000-0000-000000000002
              - column:
                  name: code
                  value: ROLE_CUSTOMER
              - column:
                  name: name
                  value: Khách hàng
              - column:
                  name: description
                  value: Người mua hàng vãng lai hoặc thành viên.
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: created_at
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP

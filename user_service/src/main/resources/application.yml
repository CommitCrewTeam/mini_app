server:
  port: 8087

spring:
  application:
    name: user_service
  datasource:
    url: jdbc:postgresql://localhost:5432/user_service
    username: ecommerce_user
    password: ecommerce_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

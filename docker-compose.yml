services:
  postgres:
    image: postgres:16
    container_name: mini_ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mini_ecommerce_network

  postgres_init:
    image: postgres:latest
    container_name: mini_ecommerce_postgres_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ecommerce_password
    command:
      - sh
      - -c
      - |
        psql -h postgres -U ecommerce_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'product_service'" | grep -q 1 || createdb -h postgres -U ecommerce_user product_service
        psql -h postgres -U ecommerce_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'inventory_service'" | grep -q 1 || createdb -h postgres -U ecommerce_user inventory_service
        psql -h postgres -U ecommerce_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'order_service'" | grep -q 1 || createdb -h postgres -U ecommerce_user order_service
        psql -h postgres -U ecommerce_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'payment_service'" | grep -q 1 || createdb -h postgres -U ecommerce_user payment_service
        psql -h postgres -U ecommerce_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'notification_service'" | grep -q 1 || createdb -h postgres -U ecommerce_user notification_service
        psql -h postgres -U ecommerce_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'analytics_service'" | grep -q 1 || createdb -h postgres -U ecommerce_user analytics_service
        psql -h postgres -U ecommerce_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'user_service'" | grep -q 1 || createdb -h postgres -U ecommerce_user user_service
    networks:
      - mini_ecommerce_network

  redis:
    image: redis:latest
    container_name: mini_ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mini_ecommerce_network

  kafka:
    image: apache/kafka:latest
    container_name: mini_ecommerce_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - mini_ecommerce_network

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mini_ecommerce_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - mini_ecommerce_network

networks:
  mini_ecommerce_network:
    name: mini_ecommerce_network

server:
  port: 8085

spring:
  application:
    name: notification_service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_service
    username: ecommerce_user
    password: ecommerce_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
